name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poczekaj na publikację Netlify
        run: sleep 180

      - name: Zgłoś adresy do IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import xml.etree.ElementTree as ET

          host = "www.goldmz.pl"
          base = f"https://{host}"
          key = "d23c7b5227af4e64a09c79fc27effecf"
          key_url = f"{base}/{key}.txt"

          with urllib.request.urlopen(key_url, timeout=30) as response:
              if response.read().decode("utf-8-sig").strip() != key:
                  raise RuntimeError("Plik klucza jest niepoprawny")

          if os.environ["EVENT"] == "workflow_dispatch":
              with urllib.request.urlopen(f"{base}/sitemap.xml", timeout=30) as response:
                  root = ET.fromstring(response.read())
              urls = [
                  node.text.strip()
                  for node in root.findall(".//{*}url/{*}loc")
                  if node.text
              ]
          else:
              before = os.environ["BEFORE"]
              if not before or set(before) == {"0"}:
                  raise RuntimeError("Brak poprzedniej wersji do porównania")
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames",
                   before, "HEAD"], text=True
              ).splitlines()
              urls = []
              for path in changed:
                  if not path.endswith(".html"):
                      continue
                  if path == "index.html":
                      route = "/"
                  elif path.endswith("/index.html"):
                      route = "/" + path[:-10]
                  else:
                      route = "/" + path
                  urls.append(base + urllib.parse.quote(route, safe="/"))

          urls = sorted(set(
              url for url in urls
              if urllib.parse.urlparse(url).hostname == host
          ))

          if not urls:
              print("Brak adresów do zgłoszenia.")
              raise SystemExit(0)

          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": key_url,
              "urlList": urls
          }).encode()

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print("Kod odpowiedzi:", response.status)
              print("Zgłoszone adresy:", *urls, sep="\n")
          PY
